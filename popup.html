<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Hide &amp; Highlight</h1>
      <span class="switch master" title="Turn the whole extension on/off">
        <input type="checkbox" id="extensionEnabled" />
        <span class="slider"></span>
      </span>
    </header>

    <section class="toggles" id="featureToggles">
      <label class="row">
        <span>Tint viewed listings (LinkedIn)</span>
        <span class="switch">
          <input type="checkbox" id="hideViewed" />
          <span class="slider"></span>
        </span>
      </label>
      <label class="row">
        <span>Per-card Hide button (all sites)</span>
        <span class="switch">
          <input type="checkbox" id="manualHide" />
          <span class="slider"></span>
        </span>
      </label>
      <label class="row">
        <span>Highlight keywords (all sites)</span>
        <span class="switch">
          <input type="checkbox" id="highlightOn" />
          <span class="slider"></span>
        </span>
      </label>
      <label class="row">
        <span>Hide “Easy Apply” jobs (LinkedIn)</span>
        <span class="switch">
          <input type="checkbox" id="hideEasyApply" />
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <button id="openSettings" class="settings-btn">
      <svg class="gear" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
        />
      </svg>
      <span class="settings-text">
        Other settings
        <small>Hidden jobs, keywords &amp; more</small>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 6l6 6-6 6" />
      </svg>
    </button>

    <script src="popup.js"></script>
  </body>
</html>
