<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hidden jobs</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="hidden.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap bar-inner">
        <div class="brand">
          <h1>Hidden jobs</h1>
          <span id="count" class="count">0</span>
        </div>
        <div class="bar-actions">
          <button id="themeToggle" class="icon-btn" title="Theme: system" aria-label="Change theme">
            <svg class="ico ico-system" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2" />
              <path d="M8 20h8M12 16v4" />
            </svg>
            <svg class="ico ico-light" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
            <svg class="ico ico-dark" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 13a8.4 8.4 0 0 1-10-10 8.5 8.5 0 1 0 10 10z" />
            </svg>
          </button>
          <button id="clearAll" class="btn btn-danger">Clear all</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="toolbar" aria-label="Filter hidden jobs">
        <div class="search">
          <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input
            id="search"
            type="search"
            autocomplete="off"
            placeholder="Search title, company or location…"
            aria-label="Search hidden jobs"
          />
        </div>

        <div class="controls">
          <div id="rangeChips" class="chip-group" role="group" aria-label="Time range">
            <button class="chip-btn is-active" data-range="all">All time</button>
            <button class="chip-btn" data-range="today">Today</button>
            <button class="chip-btn" data-range="7">7 days</button>
            <button class="chip-btn" data-range="30">30 days</button>
          </div>

          <span class="select-wrap">
            <select id="siteFilter" aria-label="Filter by site">
              <option value="">All sites</option>
            </select>
          </span>

          <span class="select-wrap">
            <select id="sort" aria-label="Sort order">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
              <option value="title">Title A–Z</option>
              <option value="company">Company A–Z</option>
            </select>
          </span>
        </div>
      </section>

      <p id="resultInfo" class="result-info" hidden></p>

      <ul id="list" class="cards"></ul>

      <div id="empty" class="state" hidden>
        <div class="state-ico" aria-hidden="true">👁</div>
        <p class="state-title">No hidden jobs yet</p>
        <p class="state-sub">Click “Hide” on a job card and it will show up here.</p>
      </div>

      <div id="noResults" class="state" hidden>
        <div class="state-ico" aria-hidden="true">🔍</div>
        <p class="state-title">Nothing matches those filters</p>
        <p class="state-sub">
          <button id="resetFilters" class="link-btn">Clear the filters</button> to see everything
          again.
        </p>
      </div>

      <section class="companies">
        <div class="section-head">
          <h2>Blocked companies <span id="companyCount" class="count">0</span></h2>
        </div>
        <p class="note">Every job card from these companies is hidden automatically.</p>
        <div class="company-add">
          <input id="companyInput" type="text" placeholder="Company name to block…" />
          <button id="companyAdd" class="btn btn-primary">Add</button>
        </div>
        <p id="companyEmpty" class="state-inline" hidden>No companies blocked.</p>
        <ul id="companyList" class="chips"></ul>
      </section>
    </main>

    <script src="hidden.js"></script>
  </body>
</html>
